# RDS connection — values injected by ECS task definition environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# S3 bucket name and CloudFront base URL — injected by ECS task definition
app.s3.bucket=${S3_BUCKET}
app.cloudfront.url=${CLOUDFRONT_URL}
app.cloudfront.distribution-id=${CLOUDFRONT_DISTRIBUTION_ID}
