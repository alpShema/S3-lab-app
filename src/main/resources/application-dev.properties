# H2 in-memory database — replaces RDS for local development
spring.datasource.url=jdbc:h2:mem:photogallery;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 browser console — available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# LocalStorageService uses these as no-ops — values are ignored in dev profile
app.s3.bucket=local-dev
app.cloudfront.url=http://localhost:8080
app.cloudfront.distribution-id=local-dev
