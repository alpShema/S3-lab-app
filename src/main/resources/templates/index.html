<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moments — Photo Gallery</title>
  <!-- System font stack — no external dependency, no SRI issue -->
  <style>
    @font-face {
      font-family: 'DisplaySerif';
      src: local('Georgia'), local('Times New Roman');
    }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #161a24;
      --border:   #252b3a;
      --accent:   #f0a500;
      --accent2:  #e05a1e;
      --text:     #e8eaf0;
      --muted:    #6b7492;
      --radius:   12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 48px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 22px;
      letter-spacing: 0.03em;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .logo span { color: var(--muted); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                 font-size: 11px; font-weight: 400; display: block;
                 -webkit-text-fill-color: var(--muted); letter-spacing: 0.12em;
                 text-transform: uppercase; margin-top: 2px; }
    .photo-count {
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Upload panel ── */
    .upload-wrap {
      max-width: 600px;
      margin: 48px auto 0;
      padding: 0 24px;
    }
    .upload-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }
    .upload-panel h2 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      margin-bottom: 24px;
      color: var(--text);
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 16px;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(240,165,0,.05);
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%;
    }
    .drop-icon { font-size: 32px; margin-bottom: 8px; }
    .drop-label { font-size: 14px; color: var(--muted); }
    .drop-label strong { color: var(--accent); }
    #file-chosen { font-size: 12px; color: var(--accent); margin-top: 6px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; color: var(--muted);
                   text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
    .field input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input[type="text"]:focus { border-color: var(--accent); }

    .btn-upload {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-upload:hover  { opacity: 0.9; }
    .btn-upload:active { transform: scale(0.98); }

    /* ── Gallery section ── */
    .gallery-header {
      max-width: 1400px;
      margin: 56px auto 20px;
      padding: 0 48px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .gallery-header h2 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 22px;
    }
    .gallery-header .divider {
      flex: 1; height: 1px; background: var(--border);
    }

    /* Masonry layout using CSS columns */
    .masonry {
      max-width: 1400px;
      margin: 0 auto 80px;
      padding: 0 48px;
      columns: 4;
      column-gap: 16px;
    }
    @media (max-width: 1100px) { .masonry { columns: 3; } }
    @media (max-width: 720px)  { .masonry { columns: 2; } }
    @media (max-width: 480px)  { .masonry { columns: 1; } }

    .photo-item {
      break-inside: avoid;
      margin-bottom: 16px;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }
    .photo-item img {
      width: 100%;
      display: block;
      border-radius: var(--radius);
      transition: transform 0.4s ease;
    }
    .photo-item:hover img { transform: scale(1.03); }

    /* Hover overlay showing description */
    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.85) 0%, transparent 55%);
      border-radius: var(--radius);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
    }
    .photo-item:hover .photo-overlay { opacity: 1; }
    .overlay-desc {
      font-size: 13px;
      font-weight: 400;
      color: #fff;
      line-height: 1.4;
    }
    .overlay-date {
      font-size: 11px;
      color: rgba(255,255,255,.5);
      margin-top: 4px;
    }

    /* Accent bar on left edge of each photo */
    .photo-item::before {
      content: '';
      position: absolute;
      top: 12px; left: 0;
      width: 3px; height: 32px;
      background: linear-gradient(var(--accent), var(--accent2));
      border-radius: 0 4px 4px 0;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .photo-item:hover::before { opacity: 1; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 80px 24px;
      color: var(--muted);
      max-width: 400px;
      margin: 0 auto;
    }
    .empty .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty p { font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div>
    <div class="logo">Moments
      <span>Photo Gallery</span>
    </div>
  </div>
  <div class="photo-count"
       th:text="${#lists.isEmpty(photos)} ? 'No photos yet' : ${#lists.size(photos)} + ' photo' + (${#lists.size(photos)} == 1 ? '' : 's')">
  </div>
</header>

<!-- Upload panel -->
<div class="upload-wrap">
  <div class="upload-panel">
    <h2>Add a new moment</h2>
    <form th:action="@{/photos}" method="post" enctype="multipart/form-data">

      <div class="drop-zone" id="dropZone">
        <input type="file" id="file" name="file" accept="image/*" required
               onchange="document.getElementById('file-chosen').textContent = this.files[0]?.name ?? ''" />
        <div class="drop-icon">🖼</div>
        <div class="drop-label">Drop an image here or <strong>browse</strong></div>
        <div id="file-chosen"></div>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <input type="text" id="description" name="description"
               placeholder="What is this moment about?" maxlength="500" required />
      </div>

      <button type="submit" class="btn-upload">Upload photo</button>
    </form>
  </div>
</div>

<!-- Gallery -->
<div class="gallery-header">
  <h2>Gallery</h2>
  <div class="divider"></div>
</div>

<div th:if="${#lists.isEmpty(photos)}" class="empty">
  <div class="empty-icon">📷</div>
  <p>Your gallery is empty.<br/>Upload your first photo above.</p>
</div>

<div th:unless="${#lists.isEmpty(photos)}" class="masonry">
  <div class="photo-item" th:each="photo : ${photos}">
    <img th:src="${photo.imageUrl()}"
         th:alt="${photo.description()}" />
    <div class="photo-overlay">
      <div class="overlay-desc" th:text="${photo.description()}"></div>
      <div class="overlay-date"
           th:text="${#temporals.format(photo.uploadedAt(), 'dd MMM yyyy · HH:mm')}"></div>
    </div>
  </div>
</div>

<script>
  // Drag-and-drop visual feedback on the drop zone
  const zone = document.getElementById('dropZone');
  zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop',      e => {
    e.preventDefault();
    zone.classList.remove('dragover');
    const input = document.getElementById('file');
    input.files = e.dataTransfer.files;
    document.getElementById('file-chosen').textContent = input.files[0]?.name ?? '';
  });
</script>

</body>
</html>
